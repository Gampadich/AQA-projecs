name: Run UI Tests (Saucedemo)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -f UI Testing/AQA-saucedemo-testing/Dockerfile -t saucedemo-tests .

      - name: Run UI Tests in Docker
        run: docker run --name saucedemo-container saucedemo-tests

      - name: Copy Allure Results
        if: always()
        run: docker cp saucedemo-container:/app/allure-results ./allure-results

      - name: Upload Allure Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-saucedemo
          path: allure-results