name: Run UI Tests (Restful-Booker)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t ui-restful-tests ./UI Testing/AQA-saucedemo-testing

      - name: Run UI Tests in Docker
        run: docker run --name ui-test-container ui-restful-tests

      - name: Copy Allure Results
        if: always()
        run: docker cp ui-test-container:/app/allure-results ./allure-results

      - name: Upload Allure Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ui-restful
          path: allure-results