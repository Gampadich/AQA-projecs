name: Run JSONPlaceholder API Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t jsonplaceholder-tests ./API-Testing/AQA-JSONPlaceholder-testing

      - name: Run Tests in Docker Container
        run: docker run --name test-container jsonplaceholder-tests

      - name: Copy Allure Results from Container
        if: always()
        run: docker cp test-container:/app/allure-results ./allure-results

      - name: Upload Allure Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-json
          path: allure-results