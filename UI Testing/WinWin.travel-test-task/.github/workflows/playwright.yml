name: Automated UI Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-playwright allure-pytest

    - name: Install Playwright Browsers
      run: playwright install --with-deps chromium

    - name: Run Tests with Pytest & Allure
      run: pytest --alluredir=allure-results
      continue-on-error: true

    - name: Get Allure history
      uses: actions/checkout@v4
      if: always()
      continue-on-error: true
      with:
        ref: gh-pages
        path: gh-pages

    - name: Install Allure CLI & Generate Report
      if: always()
      run: |
        sudo npm install -g allure-commandline
        mkdir -p allure-history
        if [ -d "gh-pages/history" ]; then cp -r gh-pages/history allure-results/; fi
        allure generate allure-results --clean -o allure-history

    - name: Deploy Allure Report to GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: allure-history
